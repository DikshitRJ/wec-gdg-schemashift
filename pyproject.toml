[project]
name = "schemashift"
version = "1.0.0"
description = "Hybrid MongoDB-to-PostgreSQL migration tool with LangGraph orchestration"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.6,<5",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13.0,<14",
    "rapidfuzz>=3.0,<4",
    "Jinja2>=3.1,<4",
    "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.0,<7",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0",
]

[project.scripts]
schemashift = "schemashift.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemashift"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["examples", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["schemashift"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
mypy_path = "src"
packages = ["schemashift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
    "e2e: End-to-end tests (require full stack)",
]
addopts = "-m 'not integration and not e2e'"
