name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGO_URI: mongodb://localhost:27017
  PG_URI: postgresql://schemashift:schemashift@localhost:5432/schemashift

jobs:
  # Phase 1: Code Quality, Linting, Typecheck & Unit Tests
  quality:
    name: "Phase 1: Code Quality & Compilation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check code formatting
        run: uv run ruff format --check .
      - name: Type check with mypy
        run: uv run mypy src
      - name: Validate OpenSpec headers
        run: uv run python scripts/check_specs.py
      - name: Run unit test suite
        run: uv run pytest tests/unit -q --cov=src/schemashift --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.xml

  # Phase 2: Integration & End-to-End Tests
  integration:
    name: "Phase 2: Integration & E2E Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Start MongoDB and PostgreSQL services
        run: docker compose up -d --wait mongo postgres
      - name: Run integration tests
        run: uv run pytest tests/integration -m integration -q
      - name: Run E2E pipeline tests
        run: uv run pytest tests/e2e -m e2e -q
      - name: Determinism verification
        run: bash scripts/check_determinism.sh
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-out
          path: workspace/out
          if-no-files-found: ignore
      - name: Tear down services
        if: always()
        run: docker compose down -v

  # Phase 3 Gate: Single unified verification tick
  ci-success:
    name: "CI Gate: Phase 1 & Phase 2 Verified"
    needs: [quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm All Quality & Integration Gates Passed
        run: echo "All Phase 1 and Phase 2 quality gates passed successfully."
